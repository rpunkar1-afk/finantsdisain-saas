name: Tervisemonitor

# Kontrollib iga päev, kas live-sait ja Peetri Claude-ühendus töötavad.
# Rikke korral avab (või uuendab) issue'd; kui kõik on jälle korras, sulgeb selle.
# Ei kasuta agenti, ainult skripti; Peetri kontroll kulutab ühe lühikese Claude-päringu.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Kontrollitav aadress"
        required: false
        default: "https://financedesign.ai"

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kontroll
        id: probe
        continue-on-error: true
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://financedesign.ai' }}
        run: node scripts/agents/health-check.mjs

      - name: Issue (ava, uuenda või sulge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Live-sait katki (automaatne tervisekontroll)"
          gh label create health --color d73a4a --description "Tervisemonitor" --force || true
          EXISTING=$(gh issue list --state open --label health --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)
          if [ "${{ steps.probe.outcome }}" = "failure" ]; then
            if [ -f health.md ]; then BODY=$(cat health.md); else BODY="Skript ei jõudnud aruannet koostada. Vaata töövoo logi."; fi
            BODY="$BODY"$'\n\n'"Töövoog: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label health --body "$BODY"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Kontroll õnnestus jälle ($(date -u +%Y-%m-%dT%H:%MZ)). Sulgen automaatselt."
            fi
          fi
