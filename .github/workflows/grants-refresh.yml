name: Refresh grants data

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Run grants refresh
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh-grants.mjs

      - name: Commit trivial update (last_verified only)
        if: steps.refresh.outputs.material_change == 'false' && steps.refresh.outputs.any_change == 'true'
        run: |
          git config user.name "grants-bot"
          git config user.email "grants-bot@users.noreply.github.com"
          git add api/grants/data.json
          git commit -m "chore: refresh grants last_verified date"
          git push

      - name: Create PR for material changes
        if: steps.refresh.outputs.material_change == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: update grants data from source changes"
          title: "Toetuste andmed muutunud - vajab ulevaatust"
          body: ${{ steps.refresh.outputs.pr_body }}
          branch: grants-refresh/auto
          add-paths: api/grants/data.json
